services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      RAILS_ENV: test
      CI: "true"
      DISABLE_PARALLELIZATION: "true"
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: relay_test
      POSTGRES_USER: relay_test
      POSTGRES_PASSWORD: local-test-only
      # Fixed credentials for the isolated test database only.
      DATABASE_URL: postgres://relay_test:local-test-only@db:5432/relay_test # pipelock:ignore PostgreSQL Connection String
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: docker-tests-only-not-a-production-secret-000000000000000000000000
      PLAID_CLIENT_ID: test_client_id
      PLAID_SECRET: test_secret
      PLAID_ENV: sandbox
      ACTIVE_STORAGE_SERVICE: test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tmp/docker-test-results:/rails/tmp/screenshots

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: relay_test
      POSTGRES_USER: relay_test
      POSTGRES_PASSWORD: local-test-only
    volumes:
      - test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_test -d relay_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  selenium:
    profiles: ["browser"]
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4444/status > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  test-db:
