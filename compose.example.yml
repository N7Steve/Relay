# ===========================================================================
# Example Docker Compose file
# ===========================================================================
#
# Purpose:
# --------
#
# This file is an example Docker Compose configuration for self hosting
# Relay on your local machine or on a cloud VPS.
#
# The configuration below is a "standard" setup that works out of the box,
# but if you're running this outside of a local network, it is recommended
# to set the environment variables for extra security.
#
# Setup:
# ------
#
# To run this, you should read the setup guide:
#
# https://github.com/N7Steve/Relay/blob/main/docs/hosting/docker.md
#
# Troubleshooting:
# ----------------
#
# Problems? Open an issue in the Relay repository:
#
# https://github.com/N7Steve/Relay/issues
#
# IPv6 Note:
# ----------
# If outbound connections (Enable Banking, Google Drive, Brandfetch) hang
# because DNS resolves to an IPv6 address the container cannot reach, keep
# the explicit IPv4-preferring DNS servers configured below or pin hosts
# with `extra_hosts`.
#

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-relay_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the Relay database password}
  POSTGRES_DB: ${POSTGRES_DB:-relay_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set the Relay secret key base}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
  GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}

services:
  web:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to your built or published Relay image}
    volumes:
      - app-storage:/rails/storage
    ports:
      - ${PORT:-3000}:3000
      # To also publish on IPv6 (dual-stack), uncomment the line below AND
      # set BINDING=:: in the environment block. See docs/hosting/docker.md
      # "Binding to IPv6" for details.
      # - "[::]:${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      <<: *rails_env
      # BINDING: "::"  # Uncomment for IPv6 dual-stack inside the container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - relay_net

  worker:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to your built or published Relay image}
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *rails_env
    networks:
      - relay_net

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relay_net

  backup:
    profiles:
      - backup
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./bin/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD # pipelock:ignore
      - BACKUP_SCHEDULE
      - BACKUP_OVERWRITE
      - BACKUP_KEEP_DAYS
      - BACKUP_DESTINATION
      - INSTANCE_ID
      # Rclone Provider Config
      # By default we map the S3 variables. If you use a different provider (e.g., gdrive), 
      # replace these with the equivalent variables you added to your .env file.
      - RCLONE_CONFIG_S3_TYPE
      - RCLONE_CONFIG_S3_PROVIDER
      - RCLONE_CONFIG_S3_ACCESS_KEY_ID
      - RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
      - RCLONE_CONFIG_S3_ENDPOINT
    command: >
      sh -c "apk add --no-cache postgresql16-client~=16 rclone~=1.66 gzip~=1 &&
             echo \"$${BACKUP_SCHEDULE:-0 2 * * *} /usr/local/bin/db-backup.sh\" > /etc/crontabs/root &&
             crond -f -d 8"
    depends_on:
      - db
    networks:
      - relay_net

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relay_net

volumes:
  app-storage:
  postgres-data:
  redis-data:

networks:
  relay_net:
    driver: bridge
