services:
  app:
    image: relay-local-app
    build:
      context: .
      dockerfile: Dockerfile.test
    entrypoint: ["ruby", "bin/docker-local-entrypoint"]
    command: ["web"]
    environment: &local-environment
      RAILS_ENV: development
      SELF_HOSTED: "true"
      ONBOARDING_STATE: open
      DB_HOST: db
      POSTGRES_DB: relay_local
      POSTGRES_USER: relay_local
      POSTGRES_PASSWORD: local-development-only
      # Fixed credentials for the isolated local development database only.
      DATABASE_URL: postgres://relay_local:local-development-only@db:5432/relay_local # pipelock:ignore PostgreSQL Connection String
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: local-development-only-stable-key-000000000000000000000000000000000000
      ACTIVE_STORAGE_SERVICE: local
      PORT: "3000"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - local-storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30

  worker:
    image: relay-local-app
    entrypoint: ["ruby", "bin/docker-local-entrypoint"]
    command: ["worker"]
    environment: *local-environment
    volumes:
      - local-storage:/rails/storage
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: relay_local
      POSTGRES_USER: relay_local
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_local -d relay_local"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  local-db:
  local-redis:
  local-storage:
