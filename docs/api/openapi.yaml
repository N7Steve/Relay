          enum:
          - pending
          - confirmed
        description: Filter by transfer status
      - name: account_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filter transfers involving this account
      - name: start_date
        in: query
        required: false
        schema:
          type: string
