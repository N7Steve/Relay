  "/api/v1/trades":
    get:
      summary: List trades
      description: Only trades in accessible accounts are returned. All writes require
        owner/full_control on the primary account and any transfer account; unavailable
        references and malformed decimal/date input are rejected. Token scope never
        overrides account sharing.
      tags:
      - Trades
      security:
      - apiKeyAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      - name: account_id
        in: query
        required: false
        description: Filter by account ID
        schema:
          type: string
      - name: account_ids
        in: query
        required: false
        description: Filter by multiple account IDs
        schema:
          type: array
          items:
            type: string
      - name: start_date
        in: query
        required: false
        description: Filter trades from this date (inclusive)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        description: Filter trades until this date (inclusive)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: trades paginated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TradeCollection"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid date filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create trade
      description: Only trades in accessible accounts are returned. All writes require
        owner/full_control on the primary account and any transfer account; unavailable
        references and malformed decimal/date input are rejected. Token scope never
        overrides account sharing.
      tags:
      - Trades
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: trade created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionResponse"
        '403':
          description: forbidden - api key missing read_write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: unauthorized - missing api key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid trade request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: account not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trade:
                  type: object
                  properties:
                    account_id:
                      type: string
                      format: uuid
                      description: Account ID (required)
                    date:
                      type: string
                      format: date
                      description: Trade date (required)
                    qty:
                      type: number
                      description: Quantity (required for buy/sell/sweep_in/sweep_out/reinvestment)
                    price:
                      type: number
                      description: Price (required for buy/sell/sweep_in/sweep_out/reinvestment)
                    amount:
                      type: number
                      description: Amount (required for dividend, deposit, withdrawal,
                        interest, fee)
                    fee:
                      type: number
                      description: Optional fee (buy/sell/sweep_in/sweep_out/reinvestment)
                    type:
                      type: string
                      enum:
                      - buy
                      - sell
                      - sweep_in
                      - sweep_out
                      - dividend
                      - reinvestment
                      - interest
                      - fee
                      - deposit
                      - withdrawal
                      description: Trade type (required)
                    security_id:
                      type: string
                      format: uuid
                      description: Security ID (one of security_id, ticker, manual_ticker
                        required)
                    ticker:
                      type: string
                      description: Ticker symbol
                    manual_ticker:
                      type: string
                      description: Manual ticker for offline securities
                    currency:
                      type: string
                      description: Currency (defaults to account currency)
                    investment_activity_label:
                      type: string
                      description: Activity label (e.g. Buy, Sell)
                    category_id:
                      type: string
                      format: uuid
                      description: Category ID
                    transfer_account_id:
                      type: string
                      format: uuid
                      description: Destination/source account ID for linked transfers.
                        Must be an account the user can write to; otherwise the request
                        returns 404.
                  required:
                  - account_id
                  - date
                  - type
              required:
              - trade
        required: true
