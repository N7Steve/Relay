            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/actions/get_context":
    post:
      summary: Get context. Uses authenticated account permissions and Relay financial
        rules.
      tags:
      - Daily operations
      security:
      - apiKeyAuth: []
      description: Shared operation with MCP. Money uses signed decimal strings. Writes
        require a unique actor-scoped idempotency_key; reusing a key with changed
        arguments returns 422. Account permissions are checked on every call. Family-wide
        organization writes require administrator and complete account visibility.
      parameters: []
      responses:
        '200':
          description: operation result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyOperationResult"
        '401':
          description: missing, expired or revoked credential
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: credential scope or account permission denied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: resource unavailable to this actor
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: invalid input or idempotency conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - arguments
              additionalProperties: false
              properties:
                arguments:
                  "$ref": "#/components/schemas/DailyInputGetContext"
        required: true
