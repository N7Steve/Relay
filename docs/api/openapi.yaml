  "/api/v1/transactions":
    get:
      summary: List transactions
      tags:
      - Transactions
      security:
      - apiKeyAuth: []
      description: 'Returns global ledger history for accessible accounts, including
        disabled accounts but excluding accounts pending deletion. Account permissions
        are enforced on every call: read_only cannot edit; account read_write permits
        category, merchant, tags and notes only. Financial changes require owner/full_control,
        including both transfer legs when applicable. Unavailable references are rejected
        with 422; inaccessible resources return 404. Transfer details are omitted
        when the other account is inaccessible. Dates use ISO 8601 and monetary input
        must be finite decimals.'
