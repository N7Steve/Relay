  "/api/v1/import_sessions":
    post:
      summary: Create import session
      description: Create or retrieve a backup session keyed by client_session_id.
        New sessions use RelayImport. Retries preserve the stored type and chunks
        of the original session, including existing SureImport sessions. Responses
        expose the stored type. Family administrator required for all import-session
        actions because chunks can span private accounts. Read/read_write scopes and
        existing chunk idempotency still apply.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      parameters: []
      responses:
        '201':
          description: import session created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: client session conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - RelayImport
                  - SureImport
                  description: Backup type. RelayImport and SureImport are accepted;
                    new sessions always use RelayImport, also when type is omitted.
                    Existing sessions keep their stored type.
                client_session_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for the full import
                    session.
                expected_chunks:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Expected number of ordered chunks before publish is
                    allowed.
  "/api/v1/import_sessions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    get:
      summary: Retrieve import session
      description: Retrieve import session status, chunk status, per-entity summary
        counts, and safe error details. Family administrator required for all import-session
        actions because chunks can span private accounts. Read/read_write scopes and
        existing chunk idempotency still apply.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: import session retrieved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/chunks":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Upload import session chunk
      description: Attach an ordered backup NDJSON chunk to an import session. New
        chunks use the stored session type. Existing chunks keep their type and are
        idempotent by sequence and client_chunk_id with content verification. Full
        backups require a family administrator and one self-contained ZIP or NDJSON
        chunk. Family administrator required for all import-session actions because
        chunks can span private accounts. Read/read_write scopes and existing chunk
        idempotency still apply.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sequence
              - raw_file_content
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                raw_file_content:
                  type: string
                  description: Raw backup NDJSON content. Each chunk is limited to
                    500MB by default; configure RELAY_IMPORT_MAX_NDJSON_SIZE_MB to
                    change the limit.
          multipart/form-data:
            schema:
              type: object
              required:
              - sequence
              - file
              properties:
                sequence:
                  type: integer
                  minimum: 1
                  description: One-based chunk sequence. Earlier dependency chunks
                    must have lower sequence numbers.
                client_chunk_id:
                  type: string
                  nullable: true
                  description: Client-provided idempotency key for this chunk.
                file:
                  type: string
                  format: binary
                  description: Multipart backup ZIP or NDJSON file upload. The size
                    limit also applies to decompressed NDJSON. Each chunk is limited
                    to 500MB by default; configure RELAY_IMPORT_MAX_NDJSON_SIZE_MB
                    to change the limit.
      parameters: []
      responses:
        '201':
          description: chunk uploaded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: chunk conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: missing or invalid content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/import_sessions/{id}/publish":
    parameters:
    - name: id
      in: path
      required: true
      description: Import session ID
      schema:
        type: string
    post:
      summary: Publish import session
      description: Queue ordered backup chunk processing for an import session. Later
        chunks can reference source IDs mapped by earlier chunks. Full snapshots require
        a family administrator and a destination without financial data. Family administrator
        required for all import-session actions because chunks can span private accounts.
        Read/read_write scopes and existing chunk idempotency still apply.
      tags:
      - Import Sessions
      security:
      - apiKeyAuth: []
      responses:
        '202':
          description: import session publish queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportSessionResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: insufficient scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: max_row_count_exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: missing expected chunks
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: enqueue failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: import session not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/imports":
    get:
      summary: List imports
      description: 'List all imports for the user''s family with pagination and filtering.
        Family administrator required for all import endpoints: uploaded contents
        and asynchronous publishing can span private accounts. Existing read/read_write
        token scopes still apply.'
      tags:
      - Imports
      security:
      - apiKeyAuth: []
      parameters:
      - name: page
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Items per page (default: 25, max: 100)'
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: Filter by status
        schema:
          type: string
          enum:
          - pending
          - complete
          - importing
          - reverting
          - revert_failed
          - failed
      - name: type
        in: query
        required: false
        description: Filter by import type. RelayImport and SureImport both select
          backup imports under either stored name.
        schema:
          type: string
          enum:
          - TransactionImport
          - TradeImport
          - AccountImport
          - MintImport
          - ActualImport
          - YnabImport
          - CategoryImport
          - RuleImport
          - MerchantImport
          - PdfImport
          - QifImport
          - RelayImport
          - SureImport
      responses:
        '200':
          description: imports filtered by type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportCollection"
    post:
      summary: Create import
      description: 'Create an import from CSV or backup NDJSON content or a multipart
        backup ZIP/NDJSON file. Version 3 full backups include original file bytes
        and require a family administrator and a destination without financial data.
        Backup requests use RelayImport for storage, responses and queued jobs, including
        requests using the old SureImport name. CSV content is limited to 10MB. Family
        administrator required for all import endpoints: uploaded contents and asynchronous
        publishing can span private accounts. Existing read/read_write token scopes
        still apply.'
