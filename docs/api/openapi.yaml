    CashFlowSankey:
      type: object
      required:
      - basis
      - income
      - spending
      - net_savings
      - nodes
      - links
      description: Refunds net within each category. Parent direct amounts exclude
        child totals before partitioning by direction. Graph income/spending may differ
        from gross monthly totals; net savings agrees. Decimal strings retain FX precision.
        Empty flow has empty nodes and links.
      properties:
        basis:
          type: string
          enum:
          - net_by_category
        income:
          type: string
        spending:
          type: string
        net_savings:
          type: string
        nodes:
          type: array
          items:
            type: object
            required:
            - id
            - name
            - kind
            - value
            - percentage
            - category_id
            - filter_value
            - color
            properties:
              id:
                type: string
                description: Stable direction-prefixed category identifier or structural
                  identifier
              name:
                type: string
              kind:
                type: string
                enum:
                - income
                - expense
                - cash_flow
                - surplus
                - deficit
              value:
                type: string
                description: Nonnegative decimal in envelope currency
              percentage:
                type: string
                description: Percentage of parent, or side total for root categories;
                  structural balancing nodes use central capacity
              category_id:
                type: string
                format: uuid
                nullable: true
              filter_value:
                type: string
                nullable: true
                description: Web transaction category filter; null means no category
                  drill-down
              color:
                type: string
                nullable: true
                description: User category color; structural colors belong to the
                  client
        links:
          type: array
          items:
            type: object
            required:
            - source
            - target
            - value
            - percentage
            properties:
              source:
                type: integer
                minimum: 0
                description: Zero-based nodes index
              target:
                type: integer
                minimum: 0
                description: Zero-based nodes index
              value:
                type: string
                description: Positive decimal in envelope currency
              percentage:
                type: string
