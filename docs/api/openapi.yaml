    ImportVerificationReadback:
      type: object
      description: RelayImport/SureImport backups only. Verification covers the supported
        product; retired modules are discarded and reported. Legacy imports compare
        supported NDJSON counts against database readback. Full snapshots verify supported
        attributes and original attachment bytes.
      properties:
        scope:
          type: string
          enum:
          - supported_product
          description: Retired module data is excluded from verified recovery.
        discarded_record_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Legacy imports only. Counts by retired record type; full snapshots
            report omissions in warnings.details.
        status:
          type: string
          enum:
          - not_verified
          - matched
          - mismatch
          - failed
          - reverted
        checked_at:
          type: string
          format: date-time
          nullable: true
        verified_records:
          type: integer
          minimum: 0
          description: Full snapshots only. Restored records whose attributes were
            verified, including the family.
        verified_attachments:
          type: integer
          minimum: 0
          description: Full snapshots only. Original files whose metadata and bytes
            were verified.
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/BackupRestoreWarning"
        expected_record_counts:
          type: object
          additionalProperties:
            type: integer
        before_counts:
          type: object
          additionalProperties:
            type: integer
        after_counts:
          type: object
          additionalProperties:
            type: integer
        actual_delta_counts:
          type: object
          additionalProperties:
            type: integer
        checked_counts:
          type: object
          additionalProperties:
            type: integer
        mismatches:
          type: object
          additionalProperties:
            type: object
            required:
            - expected
            - actual
            properties:
              expected:
                type: integer
              actual:
                type: integer
        error:
          type: string
          nullable: true
    ImportVerification:
      type: object
      description: RelayImport/SureImport backups only. Captured at upload and completed
        after import publish.
      required:
      - expected_record_counts
      - readback
      properties:
        expected_record_counts:
          type: object
          additionalProperties:
            type: integer
        readback:
          "$ref": "#/components/schemas/ImportVerificationReadback"
