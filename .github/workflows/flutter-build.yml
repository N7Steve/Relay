name: Flutter Mobile Build

on:
  workflow_call:
    outputs:
      has_app_release_aab:
        description: "Whether a signed release AAB artifact was produced"
        value: ${{ jobs.build-android.outputs.has_app_release_aab }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has_app_release_aab: ${{ steps.check_secrets.outputs.has_keystore }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Copy Relay icons from public/
        run: cp public/android-chrome-512x512.png mobile/assets/icon/app_icon.png

      - name: Generate app icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Check if keystore secrets exist
        id: check_secrets
        env:
          # Signing is restricted to a manual run of the trusted main branch.
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 || '' }}
          KEY_STORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.KEY_STORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.KEY_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.KEY_ALIAS || '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEY_STORE_PASSWORD"
            test -n "$KEY_PASSWORD"
            test -n "$KEY_ALIAS"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "✓ Keystore secrets found, will build signed APK"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No keystore secrets, will build unsigned debug APK"
          fi

      - name: Decode and setup keystore
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > mobile/android/key.properties
          echo "✓ Keystore configured successfully"

      - name: Build APK (Release)
        working-directory: mobile
        run: |
          if [ "${{ steps.check_secrets.outputs.has_keystore }}" == "true" ]; then
            echo "Building signed release APK..."
            flutter build apk --release
          else
            echo "Building debug-signed APK..."
            flutter build apk --debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build App Bundle (Release)
        if: steps.check_secrets.outputs.has_keystore == 'true'
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f mobile/android/key.properties mobile/android/app/upload-keystore.jks
