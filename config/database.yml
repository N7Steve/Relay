default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { "5432" } %>
  user: <%= ENV.fetch("POSTGRES_USER") { nil } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { nil } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "relay_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "relay_test" } %>

production:
  # Preserve existing deployments; new Relay installs should set POSTGRES_DB explicitly.
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "sure_production" } %>
