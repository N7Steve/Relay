uk:
  settings:
    hostings:
      invite_code_settings:
        description: Керуйте тим, як нові люди реєструються у вашому екземплярі %{product}.
        email_confirmation_description: Коли ввімкнено, користувачі повинні підтверджувати свою адресу електронної пошти під час її зміни.
        email_confirmation_title: Вимагати підтвердження електронної пошти
        default_family_title: Сім'я за замовчуванням для нових користувачів
        default_family_description: "Додавати нових користувачів до цієї сім'ї/групи, лише якщо у них немає запрошення."
        default_family_none: Немає (створити нову сім'ю)
        generate_tokens: Згенерувати новий код
        generated_tokens: Згенеровані коди
        title: Онбординг
        states:
          open: Відкрито
          closed: Закрито
          invite_only: Лише за запрошеннями
      show:
        general: Загальні налаштування
        sync_settings: Налаштування синхронізації
        invites: Коди запрошень
        title: Самостійний хостинг
        danger_zone: Небезпечна зона
        clear_cache: Очистити кеш даних
        clear_cache_warning: Очищення кешу даних видалить усі курси обміну, ціни на цінні папери, баланси рахунків та інші дані. Це не видалить рахунки, транзакції, категорії та інші дані, що належать користувачеві.
        confirm_clear_cache:
          title: Очистити кеш даних?
          body: Ви впевнені, що хочете очистити кеш даних? Це видалить усі курси обміну, ціни на цінні папери, баланси рахунків та інші дані. Цю дію неможливо скасувати.
        property_valuation_providers: Постачальники оцінки нерухомості
      brand_fetch_settings:
        description: Введіть ідентифікатор клієнта, наданий Brandfetch
        env_configured_message: Ви успішно налаштували свій ідентифікатор клієнта Brandfetch за допомогою змінної середовища BRAND_FETCH_CLIENT_ID.
        show_details: "(показати деталі)"
        setup_step_1_html: 'Відвідайте <a href="https://brandfetch.com/developers" target="_blank" rel="noopener noreferrer" class="underline">brandfetch.com</a> і створіть безкоштовний обліковий запис розробника Brandfetch.'
        setup_step_2_html: 'Перейдіть на сторінку <a href="https://developers.brandfetch.com/dashboard/logo-api" target="_blank" rel="noopener noreferrer" class="underline">Logo API</a>.'
        setup_step_3: 'Торкніться значка ока в розділі "Ваш ідентифікатор клієнта", щоб відкрити свій ідентифікатор клієнта, і вставте його нижче.'
        label: Ідентифікатор клієнта
        placeholder: Введіть свій ідентифікатор клієнта тут
        title: Налаштування Brandfetch
        high_res_label: Увімкнути логотипи з високою роздільною здатністю
        high_res_description: Коли ввімкнено, логотипи будуть отримуватися з роздільною здатністю 120x120 замість 40x40. Це забезпечує чіткіші зображення на дисплеях з високою щільністю пікселів.
      llm_provider_selector:
        title: Постачальник ШІ
        description: Виберіть, який LLM живить чат зі ШІ. Пакетні операції (категоризація транзакцій, виявлення продавців та обробка PDF) наразі завжди використовують OpenAI.
        env_configured_message: Успішно налаштовано за допомогою змінної середовища LLM_PROVIDER.
        provider_label: Активний постачальник LLM
        provider_openai: OpenAI
        provider_anthropic: Anthropic (Claude)
        provider_help: Зміна постачальників набуває чинності в наступному чаті. Налаштуйте облікові дані активного постачальника нижче.
        not_configured_hint: "Додайте ключ API %{provider} нижче, щоб активувати його."
        data_retention_heading: Обробка даних
        data_retention: Вхідні дані API за замовчуванням не використовуються для навчання моделей; розміщені API постачальників зберігають дані протягом ~30 днів для довіри та безпеки. Користувацькі або самостійно розміщені кінцеві точки дотримуються вашої власної політики.
      anthropic_settings:
        title: Anthropic (Claude)
        description: Введіть свій ключ API Anthropic. За бажанням вкажіть базову URL-адресу на AWS Bedrock або GCP Vertex.
        env_configured_message: Успішно налаштовано за допомогою змінних середовища.
        access_token_label: Ключ API
        access_token_placeholder: Введіть свій ключ API Anthropic
        base_url_label: Базова URL-адреса (необов'язково)
        base_url_placeholder: "https://api.anthropic.com (за замовчуванням)"
        model_label: Модель за замовчуванням (необов'язково)
        model_placeholder: "claude-sonnet-4-6 (за замовчуванням)"
        model_help: Використовується для чату та обробки PDF. Пакетні операції (категоризація, виявлення продавців) за замовчуванням використовують Haiku для економії.
      openai_settings:
        description: Введіть токен доступу та за бажанням налаштуйте власного постачальника, сумісного з OpenAI
        env_configured_message: Успішно налаштовано за допомогою змінних середовища.
        access_token_label: Токен доступу
        access_token_placeholder: Введіть свій токен доступу тут
        uri_base_label: Базова URL-адреса API (необов'язково)
        uri_base_placeholder: "https://api.openai.com/v1 (за замовчуванням)"
        model_label: Модель (необов'язково)
        model_placeholder: "gpt-4.1 (за замовчуванням)"
        json_mode_label: Режим JSON
        json_mode_auto: Авто (рекомендовано)
        json_mode_strict: Суворий (найкраще для моделей мислення)
        json_mode_none: Немає (найкраще для стандартних моделей)
        json_mode_json_object: Об'єкт JSON
        json_mode_help: "Суворий режим найкраще працює з моделями мислення (qwen-thinking, deepseek-reasoner). Режим 'Немає' найкраще працює зі стандартними моделями (llama, mistral, gpt-oss)."
        budget_heading: Бюджет токенів
        budget_description: Застосовується до викликів, сумісних з OpenAI (чат, автокатегоризація, виявлення продавців та обробка PDF). Значення за замовчуванням є консервативними для локальних моделей з малим контекстом. Збільште для хмарних моделей з більшими вікнами контексту.
        context_window_label: Вікно контексту (необов'язково)
        context_window_help: "Загальна кількість токенів, яку прийме модель. За замовчуванням: 2048 — збільште до 8192+ для хмарних OpenAI або локальних моделей з великим контекстом."
        max_response_tokens_label: Максимальна кількість токенів відповіді (необов'язково)
        max_response_tokens_help: "Токени, зарезервовані для відповіді моделі. За замовчуванням: 512. Зменште, щоб звільнити місце для довшої історії."
        max_items_per_call_label: Максимальна кількість елементів на пакет (необов'язково)
        max_items_per_call_help: "Верхня межа для пакетів автокатегоризації / виявлення продавців. За замовчуванням: 25. Більші пакети автоматично розрізаються, щоб відповідати вікну контексту."
        title: OpenAI
        model_function_calling_help: ШІ-помічник зчитує ваші дані через виклики функцій, тож виберіть модель, для якої ваш постачальник задокументував підтримку tools/function calling. Моделі без цієї підтримки спричиняють збій чату з незрозумілою помилкою постачальника.
        model_function_calling_link: Перевірити налаштовану модель
        timeout_heading: Тайм-аути
        timeout_description: Визначає, як довго можуть тривати виклики OpenAI-сумісних моделей, перш ніж Relay їх перерве. Збільште значення, якщо запускаєте локальну модель на повільному обладнанні.
        openai_request_timeout_label: Тайм-аут запиту в секундах (необов'язково)
        openai_request_timeout_help: 'За замовчуванням: 60. Застосовується до кожного OpenAI-сумісного HTTP-запиту, зокрема автокатегоризації, визначення продавців, чату, обробки PDF і викликів векторного сховища. OPENAI_REQUEST_TIMEOUT має пріоритет над цим полем.'
        ai_response_timeout_label: Тайм-аут відповіді в секундах (необов'язково)
        ai_response_timeout_help: 'За замовчуванням: 90. Застосовується лише до сторожового таймера всього ходу чату, тож розраховуйте його як суму: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × тайм-аут запиту, плюс час виконання інструментів і очікування в черзі. AI_RESPONSE_TIMEOUT має пріоритет над цим полем.'
      update:
        failure: Недійсне значення налаштування
        success: Налаштування оновлено
        invalid_onboarding_state: Недійсний стан онбордингу
        invalid_sync_time: Недійсний формат часу синхронізації. Будь ласка, використовуйте формат ГГ:ХХ (наприклад, 02:30).
        invalid_llm_budget: "%{field} має бути цілим числом ≥ %{minimum}."
        invalid_anthropic_base_url: Базова URL-адреса Anthropic має бути URL-адресою http(s).
        anthropic_model_required_for_base_url: Модель Anthropic є обов'язковою, коли встановлено власну базову URL-адресу.
        scheduler_sync_failed: Налаштування збережено, але не вдалося оновити розклад синхронізації. Будь ласка, спробуйте ще раз або перевірте журнали сервера.
      clear_cache:
        cache_cleared: Кеш даних очищено. Це може зайняти кілька хвилин.
      not_authorized: Ви не авторизовані для виконання цієї дії
      ensure_admin:
        not_authorized: Ви не авторизовані для виконання цієї дії
      ensure_super_admin_for_onboarding:
        not_authorized: Ви не авторизовані для виконання цієї дії
      sync_auto_sync_scheduler!:
        scheduler_sync_failed: Налаштування збережено, але не вдалося оновити розклад синхронізації. Будь ласка, спробуйте ще раз або перевірте журнали сервера.
      sync_settings:
        auto_sync_label: Увімкнути автоматичну синхронізацію
        auto_sync_description: Коли ввімкнено, усі рахунки будуть автоматично синхронізуватися щодня у вказаний час.
        auto_sync_time_label: Час синхронізації (ГГ:ХХ)
        auto_sync_time_description: Вкажіть час доби, коли має відбуватися автоматична синхронізація.
        include_pending_label: Включати очікувані транзакції
        include_pending_description: Коли ввімкнено, очікувані (незавершені) транзакції будуть імпортуватися та автоматично звірятися, коли їх буде проведено. Вимкніть, якщо ваш банк надає ненадійні дані про очікувані транзакції.
        env_configured_message: Це налаштування вимкнено, оскільки встановлено змінну середовища постачальника (SIMPLEFIN_INCLUDE_PENDING або PLAID_INCLUDE_PENDING). Видаліть її, щоб увімкнути це налаштування.
      rentcast_settings:
        title: RentCast
        description: Введіть ключ API RentCast, щоб отримувати характеристики та оцінку вартості нерухомості у США під час її додавання. Безкоштовний тариф обмежено 50 запитами API на місяць, спільними для пошуку об'єктів і щоденного оновлення оцінок. На платному тарифі підвищте ліміт за допомогою змінної середовища RENTCAST_MAX_REQUESTS_PER_MONTH.
        env_configured_message: Успішно налаштовано через змінну середовища RENTCAST_API_KEY.
        label: Ключ API
        placeholder: Введіть тут свій ключ API RentCast
        usage: Використано %{used} з %{limit} запитів на місяць
      realie_settings:
        title: Realie
        description: Введіть ключ API Realie, щоб отримувати характеристики та оцінку вартості нерухомості у США під час її додавання. Безкоштовний тариф обмежено 25 запитами API на місяць, спільними для пошуку об'єктів і щоденного оновлення оцінок. На платному тарифі підвищте ліміт за допомогою змінної середовища REALIE_MAX_REQUESTS_PER_MONTH.
        env_configured_message: Успішно налаштовано через змінну середовища REALIE_API_KEY.
        label: Ключ API
        placeholder: Введіть тут свій ключ API Realie
        usage: Використано %{used} з %{limit} запитів на місяць
