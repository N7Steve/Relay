        json_mode_json_object: JSON-Objekt
        json_mode_help: "Der strenge Modus funktioniert am besten mit Denk-Modellen (qwen-thinking, deepseek-reasoner). Der Modus Keiner funktioniert am besten mit Standard-Modellen (llama, mistral, gpt-oss)."
        title: OpenAI
        budget_description: 'Gilt für alle OpenAI-kompatiblen Aufrufe: Chat, automatische Kategorisierung, Händlererkennung und PDF-Verarbeitung. Die Vorgaben sind auf kleine lokale Modelle ausgelegt. Für Cloud-Modelle mit größerem Kontextfenster kannst du sie anheben.'
        budget_heading: Token-Budget
        context_window_help: 'Gesamtzahl der Tokens, die das Modell annimmt. Standard: 2048 – für OpenAI in der Cloud oder lokale Modelle mit großem Kontext auf 8192 oder mehr anheben.'
        context_window_label: Kontextfenster (optional)
        max_items_per_call_help: 'Obergrenze für Stapel bei automatischer Kategorisierung und Händlererkennung. Standard: 25. Größere Stapel werden automatisch so zerlegt, dass sie ins Kontextfenster passen.'
        max_items_per_call_label: Maximale Einträge pro Stapel (optional)
        max_response_tokens_help: 'Tokens, die für die Antwort des Modells reserviert sind. Standard: 512. Niedriger ansetzen, um Platz für längere Verläufe zu schaffen.'
        max_response_tokens_label: Maximale Antwort-Tokens (optional)
        timeout_heading: Zeitlimits
        timeout_description: Legt fest, wie lange Aufrufe OpenAI-kompatibler Modelle laufen dürfen, bevor Relay sie abbricht. Erhöhe diese Werte, wenn du ein lokales Modell auf langsamer Hardware betreibst.
        openai_request_timeout_label: Anfragezeitlimit in Sekunden (optional)
        openai_request_timeout_help: 'Standard: 60. Gilt für jede OpenAI-kompatible HTTP-Anfrage, einschließlich automatischer Kategorisierung, Händlererkennung, Chat, PDF-Verarbeitung und Vektorspeicher-Aufrufen. OPENAI_REQUEST_TIMEOUT überschreibt dieses Feld.'
        ai_response_timeout_label: Antwortzeitlimit in Sekunden (optional)
        ai_response_timeout_help: 'Standard: 90. Gilt nur für das Zeitlimit der gesamten Chat-Runde. Setz den Wert daher als Summe an: (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × Anfragezeitlimit, plus Ausführungszeit der Tools und Wartezeit in der Warteschlange. AI_RESPONSE_TIMEOUT überschreibt dieses Feld.'
