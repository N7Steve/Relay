        env_configured_message: Configurado correctamente mediante la variable de entorno REALIE_API_KEY.
        label: Clave API
        placeholder: Introduce aquí tu clave API de Realie
        usage: "%{used} de %{limit} solicitudes mensuales utilizadas"
